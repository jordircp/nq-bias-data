name: Actualizar datos NQ

on:
  workflow_dispatch:
  schedule:
    # Hora UTC.ok Cada 15 min en las ventanas antes de Londres y antes de NY (Alemania = UTC+1 en invierno, +2 en verano).
    # Varias pasadas porque GitHub a veces retrasa o se salta ejecuciones programadas.
    - cron: "7,22,37,52 4-7 * * 1-5"
    - cron: "7,22,37,52 10-13 * * 1-5"

permissions:
  contents: write

concurrency:
  group: nq-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q yfinance pandas numpy matplotlib
      - run: python nq_data.py
      - name: Guardar resultados
        run: |
          git config user.name "nq-bot"
          git config user.email "nq-bot@users.noreply.github.com"
          git add data
          git commit -m "Datos NQ $(date -u +'%Y-%m-%d %H:%M') UTC" || echo "sin cambios"
          git pull --rebase origin main || true
          git push
